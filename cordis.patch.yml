# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
# ui-settings-account and ui-chat are intentionally absent here: they are
# per-machine preferences, so each machine overrides them in its own
# $DSH_HOME/cordis.patch.yml (which outranks this file).
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-account
        model: deepseek-flash
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 16
    maxActiveSubagents: 16
- id: plugin-market
  config:
    indexes:
      - https://cdn.dsh.so/market/index.json
- id: ui-skin-whale-fantasy
  disabled: true
- id: dsh-whale-widget
  disabled: true
- id: dsh-profile-stats
  disabled: true
- id: vision-router
  name: dsh-vision-router
  config:
    progressiveTools: false
    onboardingSeen: true
- id: speech-to-text
  name: "@deepseek-ai/dsh-experimental-speech-to-text"
  config:
    defaultProvider: sensevoice-local
    language: auto
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    thresholdRatio: 0.143
    retainTokens: 10000
- id: tool-result-pruner
  disabled: true
- id: tool-subagent
  name: "@deepseek-ai/dsh-tool-subagent"
  config:
    provider: spawn
    toolName: subagent
    agentOptions:
      provider: deepseek-account
      model: deepseek-flash
      reasoningEffort: medium
